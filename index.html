<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Sim</title>

    <!--
      Titillium Web — the typeface F1 uses on its official site for the bold geometric look.
      We pull 300 / 400 / 600 / 700 / 900 weights for headings, body, and emphasis.
      Preconnect to speed up the font handshake.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!--
      flag-icons: proper SVG country flags that render identically in every browser.
      This replaces emoji flags which Chrome on Windows renders as text (DE / PL / US).
      Used as: <span className="fi fi-gb"></span>
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
